  #grid { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); }

     tiles plus the actual roll buttons; tapping a nav tile swaps in that
     axis's own picker sub-grid (8 themes or 12 domains, each with a Random
     tile up top), and the back bar is the only way back up. Feature and
     Danger rolls read whichever theme/domain are currently selected, so
     unlike Planet Oracles there are two different sub-grids to come back
     from, not one per landing tile. */
  .site-back-bar {
    flex: 0 0 auto;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  .site-back-bar[hidden] { display: none; }

    border-radius: 999px;
    padding: 10px 16px;
    font-family: "Figtree", sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--text);
    cursor: pointer;
  }
  .site-back-icon { width: 16px; height: 16px; color: var(--muted); flex: 0 0 auto; }
</style>

    const REVEAL_DANGER = {"name":"Reveal a Danger","dice":"1d100","rows":[{"min":1,"max":30,"text":"Check the theme card."},{"min":31,"max":45,"text":"Check the domain card."},{"min":46,"max":57,"text":"You encounter a hostile denizen."},{"min":58,"max":68,"text":"You face an environmental or architectural hazard."},{"min":69,"max":76,"text":"A discovery undermines or complicates your quest."},{"min":77,"max":79,"text":"You confront a harrowing situation or sensation."},{"min":80,"max":82,"text":"You face the consequences of an earlier choice or approach."},{"min":83,"max":85,"text":"Your way is blocked or trapped."},{"min":86,"max":88,"text":"A resource is diminished, broken, or lost."},{"min":89,"max":91,"text":"You face a perplexing mystery or tough choice."},{"min":92,"max":94,"text":"You lose your way or are delayed."},{"min":95,"max":100,"text":"Roll twice more on this table. Both results occur. If they are the same result, make it worse."}]};

    // A "Something unusual or unexpected" Feature result points here.
    const ASPECT_TABLE = {"name":"Aspect","dice":"1d100","rows":[{"min":1,"max":2,"text":"Blocked"},{"min":3,"max":4,"text":"Crafted"},{"min":5,"max":6,"text":"Ancient"},{"min":7,"max":8,"text":"Sunken"},{"min":9,"max":10,"text":"Trapped"},{"min":11,"max":12,"text":"Secret"},{"min":13,"max":14,"text":"Toxic"},{"min":15,"max":16,"text":"Ruined"},{"min":17,"max":18,"text":"Defended"},{"min":19,"max":20,"text":"Decaying"},{"min":21,"max":22,"text":"Marked"},{"min":23,"max":24,"text":"Guarded"},{"min":25,"max":26,"text":"Inaccessible"},{"min":27,"max":28,"text":"Foreboding"},{"min":29,"max":30,"text":"Veiled"},{"min":31,"max":32,"text":"Deep"},{"min":33,"max":34,"text":"Depleted"},{"min":35,"max":36,"text":"Foul"},{"min":37,"max":38,"text":"Elevated"},{"min":39,"max":40,"text":"Moving"},{"min":41,"max":42,"text":"Unnatural"},{"min":43,"max":44,"text":"Active"},{"min":45,"max":46,"text":"Confined"},{"min":47,"max":48,"text":"Fortified"},{"min":49,"max":50,"text":"Collapsed"},{"min":51,"max":52,"text":"Isolated"},{"min":53,"max":54,"text":"Destroyed"},{"min":55,"max":56,"text":"Open"},{"min":57,"max":58,"text":"Sacred"},{"min":59,"max":60,"text":"Flooded"},{"min":61,"max":62,"text":"Complex"},{"min":63,"max":64,"text":"Abundant"},{"min":65,"max":66,"text":"Hidden"},{"min":67,"max":68,"text":"Expansive"},{"min":69,"max":70,"text":"Mysterious"},{"min":71,"max":72,"text":"Unstable"},{"min":73,"max":74,"text":"Fragile"},{"min":75,"max":76,"text":"Broken"},{"min":77,"max":78,"text":"Ensnaring"},{"min":79,"max":80,"text":"Pillaged"},{"min":81,"max":82,"text":"Sealed"},{"min":83,"max":84,"text":"Makeshift"},{"min":85,"max":86,"text":"Treacherous"},{"min":87,"max":88,"text":"Natural"},{"min":89,"max":90,"text":"Dead"},{"min":91,"max":92,"text":"Unusual"},{"min":93,"max":94,"text":"Abandoned"},{"min":95,"max":96,"text":"Deadly"},{"min":97,"max":98,"text":"Forgotten"},{"min":99,"max":100,"text":"Mystical"}]};
    const FOCUS_TABLE = {"name":"Focus","dice":"1d100","rows":[{"min":1,"max":2,"text":"Attack"},{"min":3,"max":4,"text":"Threshold"},{"min":5,"max":6,"text":"Boundary"},{"min":7,"max":8,"text":"Alarm"},{"min":9,"max":10,"text":"Exit"},{"min":11,"max":12,"text":"Passage"},{"min":13,"max":14,"text":"Crossing"},{"min":15,"max":16,"text":"Trigger"},{"min":17,"max":18,"text":"Trap"},{"min":19,"max":20,"text":"Hideaway"},{"min":21,"max":22,"text":"Nature"},{"min":23,"max":24,"text":"Sign"},{"min":25,"max":26,"text":"Refuge"},{"min":27,"max":28,"text":"Valuables"},{"min":29,"max":30,"text":"Breach"},{"min":31,"max":32,"text":"Route"},{"min":33,"max":34,"text":"Location"},{"min":35,"max":36,"text":"Trail"},{"min":37,"max":38,"text":"Supply"},{"min":39,"max":40,"text":"History"},{"min":41,"max":42,"text":"Prisoner"},{"min":43,"max":44,"text":"Habitation"},{"min":45,"max":46,"text":"Debris"},{"min":47,"max":48,"text":"Creature"},{"min":49,"max":50,"text":"Lair"},{"min":51,"max":52,"text":"Person"},{"min":53,"max":54,"text":"Enclosure"},{"min":55,"max":56,"text":"Remains"},{"min":57,"max":58,"text":"Water"},{"min":59,"max":60,"text":"Message"},{"min":61,"max":62,"text":"Darkness"},{"min":63,"max":64,"text":"Opening"},{"min":65,"max":66,"text":"Weapon"},{"min":67,"max":68,"text":"Entry"},{"min":69,"max":70,"text":"Illumination"},{"min":71,"max":72,"text":"Obstacle"},{"min":73,"max":74,"text":"Craft"},{"min":75,"max":76,"text":"Container"},{"min":77,"max":78,"text":"Information"},{"min":79,"max":80,"text":"Grave"},{"min":81,"max":82,"text":"Equipment"},{"min":83,"max":84,"text":"Shelter"},{"min":85,"max":86,"text":"Denizen"},{"min":87,"max":88,"text":"Environment"},{"min":89,"max":90,"text":"Material"},{"min":91,"max":92,"text":"Resource"},{"min":93,"max":94,"text":"Corruption"},{"min":95,"max":96,"text":"Death"},{"min":97,"max":98,"text":"Function"},{"min":99,"max":100,"text":"Power"}]};

    // A "Trap" danger result points here: roll both for what the trap does
    // and what it uses to do it.
    const TRAP_EVENT_TABLE = {"name":"Trap Event","dice":"1d100","rows":[{"min":1,"max":4,"text":"Block"},{"min":5,"max":8,"text":"Create"},{"min":9,"max":12,"text":"Break"},{"min":13,"max":16,"text":"Puncture"},{"min":17,"max":20,"text":"Entangle"},{"min":21,"max":24,"text":"Enclose"},{"min":25,"max":28,"text":"Ambush"},{"min":29,"max":32,"text":"Snare"},{"min":33,"max":36,"text":"Change"},{"min":37,"max":40,"text":"Imitate"},{"min":41,"max":44,"text":"Crush"},{"min":45,"max":48,"text":"Drop"},{"min":49,"max":52,"text":"Conceal"},{"min":53,"max":56,"text":"Lure"},{"min":57,"max":60,"text":"Release"},{"min":61,"max":64,"text":"Obscure"},{"min":65,"max":68,"text":"Cut"},{"min":69,"max":72,"text":"Smother"},{"min":73,"max":76,"text":"Collapse"},{"min":77,"max":80,"text":"Summon"},{"min":81,"max":84,"text":"Move"},{"min":85,"max":88,"text":"Surprise"},{"min":89,"max":92,"text":"Divert"},{"min":93,"max":96,"text":"Attack"},{"min":97,"max":100,"text":"Trigger"}]};
    const TRAP_COMPONENT_TABLE = {"name":"Trap Component","dice":"1d100","rows":[{"min":1,"max":4,"text":"Pit"},{"min":5,"max":8,"text":"Water"},{"min":9,"max":12,"text":"Fire"},{"min":13,"max":16,"text":"Projectile"},{"min":17,"max":20,"text":"Passage"},{"min":21,"max":24,"text":"Fall"},{"min":25,"max":28,"text":"Debris"},{"min":29,"max":32,"text":"Fear"},{"min":33,"max":36,"text":"Alarm"},{"min":37,"max":40,"text":"Trigger"},{"min":41,"max":44,"text":"Cold"},{"min":45,"max":48,"text":"Weapon"},{"min":49,"max":52,"text":"Darkness"},{"min":53,"max":56,"text":"Decay"},{"min":57,"max":60,"text":"Path"},{"min":61,"max":64,"text":"Stone"},{"min":65,"max":68,"text":"Terrain"},{"min":69,"max":72,"text":"Poison"},{"min":73,"max":76,"text":"Barrier"},{"min":77,"max":80,"text":"Overhead"},{"min":81,"max":84,"text":"Magic"},{"min":85,"max":88,"text":"Toxin"},{"min":89,"max":92,"text":"Earth"},{"min":93,"max":96,"text":"Light"},{"min":97,"max":100,"text":"Denizen"}]};

    const log = document.getElementById('log');
    const grid = document.getElementById('grid');
    let first = true;

    function logCard(spec) {
      if (first) { log.innerHTML = ''; first = false; }
      appendCard(log, spec);
    }

    function rollSingle(table, label, withRoll) {
      const { roll, text } = rollTable(table);
      logCard({ total: text, detailText: withRoll ? 'rolled ' + roll : null });
      reportToNative(label + ': ' + text, text.slice(0, 4));
    }

    function findRow(rows, n) {
      return rows.find((r) => n >= r.min && n <= r.max);
    }

    // Which theme/domain the landing grid's roll buttons currently read from
    // - set by picking (or randomly rolling) in the theme/domain sub-grids.
    let currentThemeKey = null;
    let currentDomainKey = null;

    function rollFeature() {
      const n = 1 + Math.floor(Math.random() * 100);
      const inTheme = n <= 20;
      const text = findRow(inTheme ? THEMES[currentThemeKey].features : DOMAINS[currentDomainKey].features, n).text;
      const source = inTheme ? THEMES[currentThemeKey].name + ' theme' : DOMAINS[currentDomainKey].name + ' domain';
      logCard({ total: text, detailText: 'rolled ' + n + ' • ' + source });
      reportToNative('Feature: ' + text, text.slice(0, 4));
    }

    function rollDanger() {
      const n = 1 + Math.floor(Math.random() * 100);
      let text, source;
      if (n <= 30) { text = findRow(THEMES[currentThemeKey].dangers, n).text; source = THEMES[currentThemeKey].name + ' theme'; }
      else if (n <= 45) { text = findRow(DOMAINS[currentDomainKey].dangers, n).text; source = DOMAINS[currentDomainKey].name + ' domain'; }
      else { text = findRow(REVEAL_DANGER.rows, n).text; source = 'general danger'; }
      logCard({ total: text, detailText: 'rolled ' + n + ' • ' + source });
      reportToNative('Danger: ' + text, text.slice(0, 4));
    }

    // ---- navigation: landing grid <-> theme picker <-> domain picker ----

    const backBar = document.getElementById('backBar');
    const backBtn = document.getElementById('backBtn');
    const backLabel = document.getElementById('backLabel');

    function navTile(label, handler) {
      return { label: label + ' ›', handler };
    }

    function renderLanding() {
      backBar.hidden = true;
      grid.innerHTML = '';
      const tiles = [
        navTile('Theme: ' + THEMES[currentThemeKey].name, renderThemePicker),
        navTile('Domain: ' + DOMAINS[currentDomainKey].name, renderDomainPicker),
        { label: 'Roll Feature', handler: rollFeature },
        { label: 'Roll Danger', handler: rollDanger },
        { label: 'Aspect', handler: () => rollSingle(ASPECT_TABLE, 'Aspect', true) },
        { label: 'Focus', handler: () => rollSingle(FOCUS_TABLE, 'Focus', true) },
        { label: 'Trap Event', handler: () => rollSingle(TRAP_EVENT_TABLE, 'Trap Event', true) },
        { label: 'Trap Component', handler: () => rollSingle(TRAP_COMPONENT_TABLE, 'Trap Component', true) },
      ];
      initOracleGrid(grid, tiles);
    }

    function pickTheme(key, roll) {
      currentThemeKey = key;
      logCard({ total: THEMES[key].name, label: 'Theme', detailText: roll != null ? 'rolled ' + roll : 'picked' });
      reportToNative('Theme: ' + THEMES[key].name, THEMES[key].name.slice(0, 4));
      renderLanding();
    }

    function pickDomain(key, roll) {
      currentDomainKey = key;
      logCard({ total: DOMAINS[key].name, label: 'Domain', detailText: roll != null ? 'rolled ' + roll : 'picked' });
      reportToNative('Domain: ' + DOMAINS[key].name, DOMAINS[key].name.slice(0, 4));
      renderLanding();
    }

    function renderThemePicker() {
      backLabel.textContent = 'Site';
      backBar.hidden = false;
      grid.innerHTML = '';
      const tiles = [
        { label: '🎲 Random', handler: () => { const { roll, text } = rollTable(THEME_PICK); pickTheme(text, roll); } },
      ];
      Object.keys(THEMES).forEach((key) => {
        tiles.push({ label: THEMES[key].name, handler: () => pickTheme(key) });
      });
      initOracleGrid(grid, tiles);
    }

    function renderDomainPicker() {
      backLabel.textContent = 'Site';
      backBar.hidden = false;
      grid.innerHTML = '';
      const tiles = [
        { label: '🎲 Random', handler: () => { const { roll, text } = rollTable(DOMAIN_PICK); pickDomain(text, roll); } },
      ];
      Object.keys(DOMAINS).forEach((key) => {
        tiles.push({ label: DOMAINS[key].name, handler: () => pickDomain(key) });
      });
      initOracleGrid(grid, tiles);
    }

    backBtn.addEventListener('click', renderLanding);

    // Start with a random theme and domain already rolled, same as the
    // book's default "randomly select a theme and domain" - Feature/Danger
    // work immediately instead of needing two picks first.
    currentThemeKey = rollTable(THEME_PICK).text;
    currentDomainKey = rollTable(DOMAIN_PICK).text;
    renderLanding();
    log.innerHTML = '<div class="empty">Tap Theme or Domain to change them, or roll a Feature or Danger for the current site.</div>';
  </script>
</body>
</html>
