    const log = document.getElementById('log');
    const grid = document.getElementById('grid');
    let first = true;

    function logCard(spec) {
      if (first) { log.innerHTML = ''; first = false; }
      appendCard(log, spec);
    }

    function rollSingle(table, label, withRoll) {
      const { roll, text } = rollTable(table);
      logCard({ total: text, detailText: withRoll ? 'rolled ' + roll : null });
      reportToNative(label + ': ' + text, text.slice(0, 4));
    }

    const ORACLE = {
      label: 'Character Oracles',
      hint: 'Roll to sketch a denizen, or a beat within a fight.',
      buildTiles: () => [
        { label: 'Activity', handler: () => rollSingle(CHARACTER_TABLES.activity, 'Activity', true) },
        { label: 'Disposition', handler: () => rollSingle(CHARACTER_TABLES.disposition, 'Disposition', true) },
        { label: 'Combat: Method', handler: () => rollSingle(CHARACTER_TABLES.combat_method, 'Combat Method', true) },
        { label: 'Combat: Target', handler: () => rollSingle(CHARACTER_TABLES.combat_target, 'Combat Target', true) },
      ],
    };

    log.innerHTML = '<div class="empty">' + ORACLE.hint + '</div>';
    initOracleGrid(grid, ORACLE.buildTiles());
  </script>
