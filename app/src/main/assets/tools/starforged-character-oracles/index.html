<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starforged Character Oracles</title>
<script src="../shared/bubble.js"></script>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  #grid { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); }
  .oracle-picker {
    position: relative;
    flex: 0 0 auto;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  .oracle-trigger {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 10px 16px;
    font-family: "Figtree", sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--text);
    cursor: pointer;
  }
  .oracle-trigger:focus {
    outline: none;
    border-color: var(--gem-d12);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--gem-d12) 25%, transparent);
  }
  .oracle-chevron { width: 16px; height: 16px; color: var(--muted); flex: 0 0 auto; transition: transform 160ms ease; }
  .oracle-trigger[aria-expanded="true"] .oracle-chevron { transform: rotate(180deg); }
  .oracle-menu {
    position: absolute;
    left: 12px;
    right: 12px;
    top: 100%;
    margin-top: 6px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 6px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    z-index: 5;
    max-height: 60vh;
    overflow-y: auto;
  }
  .oracle-menu[hidden] { display: none; }
  .oracle-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: 10px;
    padding: 10px 12px;
    font-family: "Figtree", sans-serif;
    font-weight: 600;
    font-size: 0.88rem;
    color: var(--text);
    cursor: pointer;
  }
  .oracle-menu-item[aria-selected="true"] { color: var(--gem-d12); }
  .oracle-menu-item:hover, .oracle-menu-item:focus {
    outline: none;
    background: color-mix(in srgb, var(--gem-d12) 14%, var(--card));
  }
</style>
</head>
<body>
  <noscript>
    <div style="padding:16px;font-family:system-ui,sans-serif;">
      <h2>Starforged Character Oracles</h2>
      <p>This tool needs JavaScript, which is currently disabled in this WebView.</p>
      <p>That shouldn't happen - the app enables it itself. Please report this bug.</p>
    </div>
  </noscript>

  <div class="oracle-picker">
    <button id="oracleTrigger" class="oracle-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
      <span id="oracleTriggerLabel">Character</span>
      <svg class="oracle-chevron" viewBox="0 0 24 24" fill="none"><polyline points="6 9 12 15 18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div id="oracleMenu" class="oracle-menu" role="listbox" aria-label="Oracle" hidden>
      <button type="button" class="oracle-menu-item" data-key="character" role="option" aria-selected="true">Character</button>
      <button type="button" class="oracle-menu-item" data-key="name" role="option" aria-selected="false">Character Name</button>
      <button type="button" class="oracle-menu-item" data-key="campaign" role="option" aria-selected="false">Campaign Launch</button>
    </div>
  </div>
  <div id="log"></div>
  <div id="grid"></div>

    const log = document.getElementById('log');
    const grid = document.getElementById('grid');
    let first = true;

    function logCard(spec) {
      if (first) { log.innerHTML = ''; first = false; }
      appendCard(log, spec);
    }

    function rollSingle(table, label, withRoll) {
      const { roll, text } = rollTable(table);
      logCard({ total: text, detailText: withRoll ? 'rolled ' + roll : null });
      reportToNative(label + ': ' + text, text.slice(0, 4));
    }

    // For a table_text2 table (a result plus a summary column) - shows the
    // summary as the detail line instead of the roll number.
    function rollSingle2(table, label) {
      const { text, row } = rollTable(table);
      logCard({ total: text, detailText: row.text2 || null });
      reportToNative(label + ': ' + text, text.slice(0, 4));
    }

    // Character Name: Given + Family is the common case; Callsign is its own
    // roll, added by hand when it fits the character (same "combo is the
    // common case, parts are still browsable" pattern as Ironsworn's Ironlander).
    function rollCharacterName() {
      const given = rollTable(NAME_TABLES.given);
      const family = rollTable(NAME_TABLES.family_name);
      const name = given.text + ' ' + family.text;
      logCard({ total: name });
      reportToNative('Name: ' + name, name.slice(0, 4));
    }


    const ORACLES = {
      character: {
        label: "Character",
        hint: "Roll to flesh out an NPC you've just met.",
        buildTiles: () => [
          { label: "First Look", handler: () => rollSingle(CHARACTER_TABLES.first_look, "First Look", true) },
          { label: "Initial Disposition", handler: () => rollSingle(CHARACTER_TABLES.initial_disposition, "Initial Disposition", true) },
          { label: "Character Role", handler: () => rollSingle(CHARACTER_TABLES.role, "Character Role", true) },
          { label: "Character Goal", handler: () => rollSingle(CHARACTER_TABLES.goal, "Character Goal", true) },
          { label: "Revealed Character Aspect", handler: () => rollSingle(CHARACTER_TABLES.revealed_aspect, "Revealed Character Aspect", true) }
        ],
      },
      name: {
        label: "Character Name",
        hint: "Roll a full name, or its parts individually.",
        buildTiles: () => [
          { label: "Full Name", handler: rollCharacterName },
          { label: "Given Name", handler: () => rollSingle(NAME_TABLES.given, "Given Name", true) },
          { label: "Callsign", handler: () => rollSingle(NAME_TABLES.callsign, "Callsign", true) },
          { label: "Family Name", handler: () => rollSingle(NAME_TABLES.family_name, "Family Name", true) }
        ],
      },
      campaign: {
        label: "Campaign Launch",
        hint: "Roll to spark a new campaign.",
        buildTiles: () => [
          { label: "Background Assets", handler: () => rollSingle2(CAMPAIGN_TABLES.background_assets, "Background Assets") },
          { label: "Backstory Prompts", handler: () => rollSingle(CAMPAIGN_TABLES.backstory_prompts, "Backstory Prompts", true) },
          { label: "Starship History", handler: () => rollSingle(CAMPAIGN_TABLES.starship_history, "Starship History", true) },
          { label: "Starship Quirks", handler: () => rollSingle(CAMPAIGN_TABLES.starship_quirks, "Starship Quirks", true) },
          { label: "Sector Trouble", handler: () => rollSingle(CAMPAIGN_TABLES.sector_trouble, "Sector Trouble", true) },
          { label: "Inciting Incident", handler: () => rollSingle(CAMPAIGN_TABLES.inciting_incident, "Inciting Incident", true) }
        ],
      },
    };

    function renderOracle(key) {
      grid.innerHTML = '';
      initOracleGrid(grid, ORACLES[key].buildTiles());
      if (first) {
        log.innerHTML = '<div class="empty">' + ORACLES[key].hint + '</div>';
      }
    }

    const oracleTrigger = document.getElementById('oracleTrigger');
    const oracleTriggerLabel = document.getElementById('oracleTriggerLabel');
    const oracleMenu = document.getElementById('oracleMenu');

    function openOracleMenu() {
      oracleMenu.hidden = false;
      oracleTrigger.setAttribute('aria-expanded', 'true');
      document.addEventListener('click', handleOracleMenuOutsideClick, { capture: true });
    }
    function closeOracleMenu() {
      oracleMenu.hidden = true;
      oracleTrigger.setAttribute('aria-expanded', 'false');
      document.removeEventListener('click', handleOracleMenuOutsideClick, { capture: true });
    }
    function handleOracleMenuOutsideClick(e) {
      if (!oracleMenu.contains(e.target) && e.target !== oracleTrigger) closeOracleMenu();
    }
    oracleTrigger.addEventListener('click', () => {
      if (oracleMenu.hidden) openOracleMenu(); else closeOracleMenu();
    });

    function selectOracle(key) {
      oracleTriggerLabel.textContent = ORACLES[key].label;
      oracleMenu.querySelectorAll('.oracle-menu-item').forEach((item) => {
        item.setAttribute('aria-selected', item.dataset.key === key ? 'true' : 'false');
      });
      renderOracle(key);
    }
    oracleMenu.querySelectorAll('.oracle-menu-item').forEach((item) => {
      item.addEventListener('click', () => {
        selectOracle(item.dataset.key);
        closeOracleMenu();
      });
    });

    selectOracle('character');

  </script>
