<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ironsworn Delve Threat Oracles</title>
<script src="../shared/bubble.js"></script>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  #grid { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); }
</style>
</head>
<body>
  <noscript>
    <div style="padding:16px;font-family:system-ui,sans-serif;">
      <h2>Ironsworn Delve Threat Oracles</h2>
      <p>This tool needs JavaScript, which is currently disabled in this WebView.</p>
      <p>That shouldn't happen - the app enables it itself. Please report this bug.</p>
    </div>
  </noscript>

  <div id="log"></div>
  <div id="grid"></div>

  <script src="../shared/oracle.js"></script>
  <script>
    // Ironsworn: Delve oracles, by Shawn Tomkin - CC BY 4.0
    // (https://creativecommons.org/licenses/by/4.0). Sourced from Datasworn
    // (https://github.com/rsek/datasworn). Rows are {min, max, text}; roll
    // 1d100 and find the row whose range contains it. Category rolls a kind
    // of long-term threat; each threat's own table then suggests how it
    // advances the next time it acts.
    const THREAT_TABLES = {"category":{"name":"Category","dice":"1d100","rows":[{"min":1,"max":10,"text":"Burgeoning Conflict"},{"min":11,"max":20,"text":"Cursed Site"},{"min":21,"max":30,"text":"Environmental Calamity"},{"min":31,"max":40,"text":"Malignant Plague"},{"min":41,"max":50,"text":"Rampaging Creature"},{"min":51,"max":60,"text":"Ravaging Horde"},{"min":61,"max":70,"text":"Scheming Leader"},{"min":71,"max":80,"text":"Power-Hungry Mystic"},{"min":81,"max":90,"text":"Zealous Cult"},{"min":91,"max":100,"text":"Roll twice"}]},"burgeoning_conflict":{"name":"Burgeoning Conflict","dice":"1d100","rows":[{"min":1,"max":10,"text":"Allow warmongers to gain influence"},{"min":11,"max":20,"text":"Break a treaty"},{"min":21,"max":30,"text":"Force a hasty decision"},{"min":31,"max":40,"text":"Deepen suspicions"},{"min":41,"max":50,"text":"Trigger a confrontation"},{"min":51,"max":60,"text":"Subvert a potential accord"},{"min":61,"max":70,"text":"Isolate the antagonists"},{"min":71,"max":80,"text":"Draw new battle lines"},{"min":81,"max":90,"text":"Reveal an unexpected aspect of the dispute"},{"min":91,"max":100,"text":"Introduce a new person or faction to complicate the situation"}]},"cursed_site":{"name":"Cursed Site","dice":"1d100","rows":[{"min":1,"max":10,"text":"Unleash a creature or being"},{"min":11,"max":20,"text":"Lure the unwary into its depths"},{"min":21,"max":30,"text":"Offer promises of power"},{"min":31,"max":40,"text":"Reveal a new aspect of its cursed history"},{"min":41,"max":50,"text":"Expand its malignancy to surrounding lands"},{"min":51,"max":60,"text":"Leave its mark on an inhabitant or visitor"},{"min":61,"max":70,"text":"Reveal hidden depths"},{"min":71,"max":80,"text":"Ensnare an important person or object"},{"min":81,"max":90,"text":"Corrupt the environment"},{"min":91,"max":100,"text":"Transform its nature"}]},"environmental_calamity":{"name":"Environmental Calamity","dice":"1d100","rows":[{"min":1,"max":10,"text":"Devastate a place"},{"min":11,"max":20,"text":"Block a path"},{"min":21,"max":30,"text":"Threaten a community with imminent destruction"},{"min":31,"max":40,"text":"Manifest unexpected effects"},{"min":41,"max":50,"text":"Expand in scope or intensity"},{"min":51,"max":60,"text":"Allow someone to take advantage"},{"min":61,"max":70,"text":"Deprive of resources"},{"min":71,"max":80,"text":"Isolate an important person or community"},{"min":81,"max":90,"text":"Force refugees into hostile lands"},{"min":91,"max":100,"text":"Disrupt natural ecosystems"}]},"malignant_plague":{"name":"Malignant Plague","dice":"1d100","rows":[{"min":1,"max":10,"text":"Manifest new symptoms or effects"},{"min":11,"max":20,"text":"Infect someone important"},{"min":21,"max":30,"text":"Expand to new territory or communities"},{"min":31,"max":40,"text":"Allow someone to take advantage"},{"min":41,"max":50,"text":"Allow someone to take the blame"},{"min":51,"max":60,"text":"Create panic or disorder"},{"min":61,"max":70,"text":"Force a horrible decision"},{"min":71,"max":80,"text":"Lure into complacency"},{"min":81,"max":90,"text":"Reveal the root of the sickness"},{"min":91,"max":100,"text":"Undermine a potential cure"}]},"rampaging_creature":{"name":"Rampaging Creature","dice":"1d100","rows":[{"min":1,"max":10,"text":"Reveal a new aspect of its nature or abilities"},{"min":11,"max":20,"text":"Expand its territory"},{"min":21,"max":30,"text":"Make a sudden and brutal attack"},{"min":31,"max":40,"text":"Control or influence lesser creatures"},{"min":41,"max":50,"text":"Create confusion or strife"},{"min":51,"max":60,"text":"Leave foreboding signs"},{"min":61,"max":70,"text":"Lure the unwary"},{"min":71,"max":80,"text":"Imperil an event"},{"min":81,"max":90,"text":"Assert control over a location"},{"min":91,"max":100,"text":"Threaten resources"}]},"ravaging_horde":{"name":"Ravaging Horde","dice":"1d100","rows":[{"min":1,"max":10,"text":"Overrun defenses"},{"min":11,"max":20,"text":"Gather resources"},{"min":21,"max":30,"text":"Attack a location"},{"min":31,"max":40,"text":"Expand forces"},{"min":41,"max":50,"text":"Appoint or reveal a leader"},{"min":51,"max":60,"text":"Send forth a champion"},{"min":61,"max":70,"text":"Create a diversion"},{"min":71,"max":80,"text":"Undermine an opposing force from within"},{"min":81,"max":90,"text":"Cut off supplies or reinforcements"},{"min":91,"max":100,"text":"Employ a new weapon"}]},"scheming_leader":{"name":"Scheming Leader","dice":"1d100","rows":[{"min":1,"max":10,"text":"Defeat an enemy"},{"min":11,"max":20,"text":"Form a new alliance"},{"min":21,"max":30,"text":"Usurp or undermine another leader"},{"min":31,"max":40,"text":"Force the loyalty of a community or important person"},{"min":41,"max":50,"text":"Enact a new law or tradition"},{"min":51,"max":60,"text":"Rescind an old law or tradition"},{"min":61,"max":70,"text":"Reveal a true intention"},{"min":71,"max":80,"text":"Unravel an existing alliance"},{"min":81,"max":90,"text":"Incite conflict"},{"min":91,"max":100,"text":"Use an unexpected capability or asset"}]},"power_hungry_mystic":{"name":"Power-Hungry Mystic","dice":"1d100","rows":[{"min":1,"max":10,"text":"Gain hidden knowledge"},{"min":11,"max":20,"text":"Assault an enemy with magic"},{"min":21,"max":30,"text":"Despoil a place through magic"},{"min":31,"max":40,"text":"Forge a bond with ancient forces"},{"min":41,"max":50,"text":"Create magical wards or protections"},{"min":51,"max":60,"text":"Obtain a powerful artifact"},{"min":61,"max":70,"text":"Tempt with power or secrets"},{"min":71,"max":80,"text":"Recruit a follower or ally"},{"min":81,"max":90,"text":"Sacrifice something in exchange for greater power"},{"min":91,"max":100,"text":"Use magic to trick or deceive"}]},"zealous_cult":{"name":"Zealous Cult","dice":"1d100","rows":[{"min":1,"max":10,"text":"Overtake a faction or community"},{"min":11,"max":20,"text":"Unlock secrets to greater power"},{"min":21,"max":30,"text":"Establish false credibility"},{"min":31,"max":40,"text":"Appoint or reveal a leader"},{"min":41,"max":50,"text":"Lure new members or establish alliances"},{"min":51,"max":60,"text":"Subvert opposition through devious schemes"},{"min":61,"max":70,"text":"Attack opposition directly"},{"min":71,"max":80,"text":"Spread the word of its doctrine"},{"min":81,"max":90,"text":"Reveal a dire prophecy"},{"min":91,"max":100,"text":"Reveal its true nature or goal"}]}};

    const log = document.getElementById('log');
    const grid = document.getElementById('grid');
    let first = true;

    function logCard(spec) {
      if (first) { log.innerHTML = ''; first = false; }
      appendCard(log, spec);
    }

    function rollSingle(table, label, withRoll) {
      const { roll, text } = rollTable(table);
      logCard({ total: text, detailText: withRoll ? 'rolled ' + roll : null });
      reportToNative(label + ': ' + text, text.slice(0, 4));
    }

    const ORACLE = {
      label: 'Threat Oracles',
      hint: 'Roll Category for a new threat, then its own table to advance one already in play.',
      buildTiles: () => [
        { label: 'Category', handler: () => rollSingle(THREAT_TABLES.category, 'Threat Category', true) },
        { label: 'Burgeoning Conflict', handler: () => rollSingle(THREAT_TABLES.burgeoning_conflict, 'Burgeoning Conflict', true) },
        { label: 'Cursed Site', handler: () => rollSingle(THREAT_TABLES.cursed_site, 'Cursed Site', true) },
        { label: 'Environmental Calamity', handler: () => rollSingle(THREAT_TABLES.environmental_calamity, 'Environmental Calamity', true) },
        { label: 'Malignant Plague', handler: () => rollSingle(THREAT_TABLES.malignant_plague, 'Malignant Plague', true) },
        { label: 'Rampaging Creature', handler: () => rollSingle(THREAT_TABLES.rampaging_creature, 'Rampaging Creature', true) },
        { label: 'Ravaging Horde', handler: () => rollSingle(THREAT_TABLES.ravaging_horde, 'Ravaging Horde', true) },
        { label: 'Scheming Leader', handler: () => rollSingle(THREAT_TABLES.scheming_leader, 'Scheming Leader', true) },
        { label: 'Power-Hungry Mystic', handler: () => rollSingle(THREAT_TABLES.power_hungry_mystic, 'Power-Hungry Mystic', true) },
        { label: 'Zealous Cult', handler: () => rollSingle(THREAT_TABLES.zealous_cult, 'Zealous Cult', true) },
      ],
    };

    log.innerHTML = '<div class="empty">' + ORACLE.hint + '</div>';
    initOracleGrid(grid, ORACLE.buildTiles());
  </script>
</body>
</html>
