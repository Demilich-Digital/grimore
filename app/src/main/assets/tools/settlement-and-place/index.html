    const grid = document.getElementById('grid');
    let first = true;

    function logCard(spec) {
      if (first) { log.innerHTML = ''; first = false; }
      appendCard(log, spec);
    }

    function rollSingle(key, label) {
      const { text } = rollTable(TABLES[key]);
      logCard({ label, total: text });
      reportToNative(label + ': ' + text, text.slice(0, 4));
    }

    function rollSettlementName() {
      const prefix = rollTable(TABLES.settlement_prefix);
      const suffix = rollTable(TABLES.settlement_suffix);
      const name = prefix.text + suffix.text.toLowerCase();
      logCard({ label: 'Settlement Name', total: name });
      reportToNative('Settlement Name: ' + name, name.slice(0, 4));
    }

    initOracleGrid(grid, [
      { label: 'Region', handler: () => rollSingle('region', 'Region') },
      { label: 'Location', handler: () => rollSingle('location', 'Location') },
      { label: 'Descriptor', handler: () => rollSingle('location_descriptor', 'Descriptor') },
      { label: 'Trouble', handler: () => rollSingle('settlement_trouble', 'Trouble') },
      { label: 'Settlement Name', handler: rollSettlementName },
    ]);
