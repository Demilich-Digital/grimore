<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starforged Faction Oracles</title>
<script src="../shared/bubble.js"></script>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  #grid { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); }
  .oracle-picker {
    position: relative;
    flex: 0 0 auto;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  .oracle-trigger {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 10px 16px;
    font-family: "Figtree", sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--text);
    cursor: pointer;
  }
  .oracle-trigger:focus {
    outline: none;
    border-color: var(--gem-d12);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--gem-d12) 25%, transparent);
  }
  .oracle-chevron { width: 16px; height: 16px; color: var(--muted); flex: 0 0 auto; transition: transform 160ms ease; }
  .oracle-trigger[aria-expanded="true"] .oracle-chevron { transform: rotate(180deg); }
  .oracle-menu {
    position: absolute;
    left: 12px;
    right: 12px;
    top: 100%;
    margin-top: 6px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 6px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    z-index: 5;
    max-height: 60vh;
    overflow-y: auto;
  }
  .oracle-menu[hidden] { display: none; }
  .oracle-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: 10px;
    padding: 10px 12px;
    font-family: "Figtree", sans-serif;
    font-weight: 600;
    font-size: 0.88rem;
    color: var(--text);
    cursor: pointer;
  }
  .oracle-menu-item[aria-selected="true"] { color: var(--gem-d12); }
  .oracle-menu-item:hover, .oracle-menu-item:focus {
    outline: none;
    background: color-mix(in srgb, var(--gem-d12) 14%, var(--card));
  }
</style>
</head>
<body>
  <noscript>
    <div style="padding:16px;font-family:system-ui,sans-serif;">
      <h2>Starforged Faction Oracles</h2>
      <p>This tool needs JavaScript, which is currently disabled in this WebView.</p>
      <p>That shouldn't happen - the app enables it itself. Please report this bug.</p>
    </div>
  </noscript>

    </button>
    <div id="oracleMenu" class="oracle-menu" role="listbox" aria-label="Oracle" hidden>

      <button type="button" class="oracle-menu-item" data-key="name" role="option" aria-selected="false">Faction Name</button>
    </div>
  </div>
  <div id="log"></div>
  <div id="grid"></div>

const NAME_TABLES = {"legacy":{"name":"Legacy","dice":"1d100","rows":[{"min":1,"max":2,"text":"Ancient"},{"min":3,"max":4,"text":"Ashen"},{"min":5,"max":6,"text":"Awakened"},{"min":7,"max":8,"text":"Azure"},{"min":9,"max":10,"text":"Blessed"},{"min":11,"max":12,"text":"Bloody"},{"min":13,"max":14,"text":"Broken"},{"min":15,"max":16,"text":"Ceaseless"},{"min":17,"max":18,"text":"Crimson"},{"min":19,"max":20,"text":"Cursed"},{"min":21,"max":22,"text":"Dawning"},{"min":23,"max":24,"text":"Dissident"},{"min":25,"max":26,"text":"Ebon"},{"min":27,"max":28,"text":"Elder"},{"min":29,"max":30,"text":"Enduring"},{"min":31,"max":32,"text":"Enlightened"},{"min":33,"max":34,"text":"Exalted"},{"min":35,"max":36,"text":"Fallen"},{"min":37,"max":38,"text":"Fated"},{"min":39,"max":40,"text":"First"},{"min":41,"max":42,"text":"Forgotten"},{"min":43,"max":44,"text":"Forsaken"},{"min":45,"max":46,"text":"Gloaming"},{"min":47,"max":48,"text":"Golden"},{"min":49,"max":50,"text":"Hidden"},{"min":51,"max":52,"text":"Infernal"},{"min":53,"max":54,"text":"Infinite"},{"min":55,"max":56,"text":"Iron"},{"min":57,"max":58,"text":"Kindred"},{"min":59,"max":60,"text":"Obsidian"},{"min":61,"max":62,"text":"Radiant"},{"min":63,"max":64,"text":"Risen"},{"min":65,"max":66,"text":"Sacred"},{"min":67,"max":68,"text":"Sapphire"},{"min":69,"max":70,"text":"Scarlet"},{"min":71,"max":72,"text":"Serene"},{"min":73,"max":74,"text":"Shattered"},{"min":75,"max":76,"text":"Shining"},{"min":77,"max":78,"text":"Silent"},{"min":79,"max":80,"text":"Silver"},{"min":81,"max":82,"text":"Sovereign"},{"min":83,"max":84,"text":"Stellar"},{"min":85,"max":86,"text":"Sundered"},{"min":87,"max":88,"text":"Supreme"},{"min":89,"max":90,"text":"Undying"},{"min":91,"max":92,"text":"Unified"},{"min":93,"max":94,"text":"United"},{"min":95,"max":96,"text":"Universal"},{"min":97,"max":98,"text":"Veiled"},{"min":99,"max":100,"text":"Wandering"}]},"affiliation":{"name":"Affiliation","dice":"1d100","rows":[{"min":1,"max":4,"text":"Accord"},{"min":5,"max":8,"text":"Alliance"},{"min":9,"max":12,"text":"Ascendancy"},{"min":13,"max":16,"text":"Circle"},{"min":17,"max":20,"text":"Coalition"},{"min":21,"max":24,"text":"Collective"},{"min":25,"max":28,"text":"Commonwealth"},{"min":29,"max":32,"text":"Confederation"},{"min":33,"max":36,"text":"Consortium"},{"min":37,"max":40,"text":"Council"},{"min":41,"max":44,"text":"Court"},{"min":45,"max":48,"text":"Covenant"},{"min":49,"max":52,"text":"Dominion"},{"min":53,"max":56,"text":"Empire"},{"min":57,"max":60,"text":"Federation"},{"min":61,"max":64,"text":"Imperium"},{"min":65,"max":68,"text":"League"},{"min":69,"max":72,"text":"Legion"},{"min":73,"max":76,"text":"Order"},{"min":77,"max":80,"text":"Pact"},{"min":81,"max":84,"text":"Regiment"},{"min":85,"max":88,"text":"Republic"},{"min":89,"max":92,"text":"Sphere"},{"min":93,"max":96,"text":"Syndicate"},{"min":97,"max":100,"text":"Union"}]},"identity":{"name":"Identity","dice":"1d100","rows":[{"min":1,"max":2,"text":"Blades"},{"min":3,"max":4,"text":"Builders"},{"min":5,"max":6,"text":"Daggers"},{"min":7,"max":8,"text":"Defenders"},{"min":9,"max":10,"text":"Disciples"},{"min":11,"max":12,"text":"Domains"},{"min":13,"max":14,"text":"Drifters"},{"min":15,"max":16,"text":"Embers"},{"min":17,"max":18,"text":"Flames"},{"min":19,"max":20,"text":"Fleet"},{"min":21,"max":22,"text":"Guardians"},{"min":23,"max":24,"text":"Hammers"},{"min":25,"max":26,"text":"Harbingers"},{"min":27,"max":28,"text":"Heralds"},{"min":29,"max":30,"text":"Hounds"},{"min":31,"max":32,"text":"Hunters"},{"min":33,"max":34,"text":"Jackals"},{"min":35,"max":36,"text":"Keepers"},{"min":37,"max":38,"text":"Knights"},{"min":39,"max":40,"text":"Menders"},{"min":41,"max":42,"text":"Outcasts"},{"min":43,"max":44,"text":"Phantoms"},{"min":45,"max":46,"text":"Planets"},{"min":47,"max":48,"text":"Raiders"},{"min":49,"max":50,"text":"Ravens"},{"min":51,"max":52,"text":"Realms"},{"min":53,"max":54,"text":"Reavers"},{"min":55,"max":56,"text":"Relics"},{"min     const log = document.getElementById('log');
    const grid = document.getElementById('grid');
    let first = true;

    function logCard(spec) {
      if (first) { log.innerHTML = ''; first = false; }
      appendCard(log, spec);
    }

    function rollSingle(table, label, withRoll) {
      const { roll, text } = rollTable(table);
      logCard({ total: text, detailText: withRoll ? 'rolled ' + roll : null });
      reportToNative(label + ': ' + text, text.slice(0, 4));
    }

    // For a table_text2 table (a result plus a summary column) - shows the
    // summary as the detail line instead of the roll number.
    function rollSingle2(table, label) {
      const { text, row } = rollTable(table);
      logCard({ total: text, detailText: row.text2 || null });
      reportToNative(label + ': ' + text, text.slice(0, 4));
    }

    // Faction Name Template (Datasworn: factions/name/template) picks one of
    // four patterns that combine Legacy/Affiliation/Identity - reproduced by
    // hand since it composes three separate table rolls into one name, same
    // as Ironsworn's Ironlander/Settlement Name combos.
    function rollFactionName() {
      const pattern = 1 + Math.floor(Math.random() * 100);
      const legacy = () => rollTable(NAME_TABLES.legacy).text;
      const affiliation = () => rollTable(NAME_TABLES.affiliation).text;
      const identity = () => rollTable(NAME_TABLES.identity).text;
      let name;
      if (pattern <= 40) name = legacy() + ' ' + affiliation();
      else if (pattern <= 55) name = legacy() + ' ' + identity();
      else if (pattern <= 70) name = identity() + ' of the ' + legacy() + ' ' + affiliation();
      else name = affiliation() + ' of the ' + legacy() + ' ' + identity();
      logCard({ total: name });
      reportToNative('Faction Name: ' + name, name.slice(0, 4));
    }


    const ORACLES = {
      faction: {
        label: "Faction",
        hint: "Roll to build or complicate a faction.",
        buildTiles: () => [
          { label: "Faction Type", handler: () => rollSingle2(FACTION_TABLES.type, "Faction Type") },
          { label: "Influence", handler: () => rollSingle2(FACTION_TABLES.influence, "Influence") },
          { label: "Dominion", handler: () => rollSingle(FACTION_TABLES.dominion, "Dominion", true) },
          { label: "Dominion: Leadership", handler: () => rollSingle(FACTION_TABLES.dominion_leadership, "Dominion: Leadership", true) },
          { label: "Guild", handler: () => rollSingle(FACTION_TABLES.guild, "Guild", true) },

      },
      name: {

        hint: "Roll a faction name, or its parts individually.",

          { label: "Faction Name", handler: rollFactionName },
          { label: "Legacy", handler: () => rollSingle(NAME_TABLES.legacy, "Legacy", true) },
          { label: "Affiliation", handler: () => rollSingle(NAME_TABLES.affiliation, "Affiliation", true) },
          { label: "Identity", handler: () => rollSingle(NAME_TABLES.identity, "Identity", true) }

      },
    };

    function renderOracle(key) {
      grid.innerHTML = '';
      initOracleGrid(grid, ORACLES[key].buildTiles());
      if (first) {
        log.innerHTML = '<div class="empty">' + ORACLES[key].hint + '</div>';
      }
    }

    const oracleTrigger = document.getElementById('oracleTrigger');
    const oracleTriggerLabel = document.getElementById('oracleTriggerLabel');
    const oracleMenu = document.getElementById('oracleMenu');

    function openOracleMenu() {
      oracleMenu.hidden = false;
      oracleTrigger.setAttribute('aria-expanded', 'true');
      document.addEventListener('click', handleOracleMenuOutsideClick, { capture: true });
    }
    function closeOracleMenu() {
      oracleMenu.hidden = true;
      oracleTrigger.setAttribute('aria-expanded', 'false');
      document.removeEventListener('click', handleOracleMenuOutsideClick, { capture: true });
    }
    function handleOracleMenuOutsideClick(e) {
      if (!oracleMenu.contains(e.target) && e.target !== oracleTrigger) closeOracleMenu();
    }
    oracleTrigger.addEventListener('click', () => {
      if (oracleMenu.hidden) openOracleMenu(); else closeOracleMenu();
    });

    function selectOracle(key) {
      oracleTriggerLabel.textContent = ORACLES[key].label;
      oracleMenu.querySelectorAll('.oracle-menu-item').forEach((item) => {
        item.setAttribute('aria-selected', item.dataset.key === key ? 'true' : 'false');
      });
      renderOracle(key);
    }
    oracleMenu.querySelectorAll('.oracle-menu-item').forEach((item) => {
      item.addEventListener('click', () => {
        selectOracle(item.dataset.key);
        closeOracleMenu();
      });
    });

    selectOracle('faction');

  </script>
</body>
</html>
