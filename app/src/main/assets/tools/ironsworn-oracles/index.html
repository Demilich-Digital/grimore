    const log = document.getElementById('log');
    const grid = document.getElementById('grid');
    const select = document.getElementById('oracleSelect');
    let first = true;

    function logCard(spec) {
      if (first) { log.innerHTML = ''; first = false; }
      appendCard(log, spec);
    }

    function rollSingle(table, label, withRoll) {
      const { roll, text } = rollTable(table);
      logCard({ label, total: text, detailText: withRoll ? 'rolled ' + roll : null });
      reportToNative(label + ': ' + text, text.slice(0, 4));
    }

    function rollPlotPrompt() {
      const action = rollTable(PLOT_TABLES.action);
      const theme = rollTable(PLOT_TABLES.theme);
      const prompt = action.text + ' + ' + theme.text;
      logCard({ label: 'Action + Theme', total: prompt, detailText: 'Action ' + action.roll + ', Theme ' + theme.roll });
      reportToNative(prompt, action.text.slice(0, 4));
    }

    function rollIronlander() {
      const a = rollTable(NAME_TABLES.ironlander_a);
      const b = rollTable(NAME_TABLES.ironlander_b);
      const name = a.text + ' ' + b.text;
      logCard({ label: 'Ironlander', total: name });
      reportToNative('Ironlander: ' + name, a.text.slice(0, 4));
    }

    function rollSettlementName() {
      const prefix = rollTable(SETTLEMENT_TABLES.settlement_prefix);
      const suffix = rollTable(SETTLEMENT_TABLES.settlement_suffix);
      const name = prefix.text + suffix.text.toLowerCase();
      logCard({ label: 'Settlement Name', total: name });
      reportToNative('Settlement Name: ' + name, name.slice(0, 4));
    }

    // Each oracle in the picker: its own hint (shown in the empty log until
    // the first roll of the session, whichever oracle that happens to be in)
    // and its own set of grid tiles. The log itself is shared and never
    // clears on switch - swapping oracles mid-session to build one scene is
    // the whole point of consolidating these into one tool.
    const ORACLES = {
      ask: {
        hint: 'Ask a yes/no question, then pick how likely it is.',
        buildTiles: () => Object.keys(ASK_TABLES).map((key) => ({
          label: ASK_TABLES[key].name,
          handler: () => rollSingle(ASK_TABLES[key], ASK_TABLES[key].name, true),
        })),
      },
      plot: {
        hint: 'Roll for a discovery, event, goal, or plot twist.',
        buildTiles: () => [
          { label: 'Action + Theme', handler: rollPlotPrompt },
          { label: 'Action', handler: () => rollSingle(PLOT_TABLES.action, 'Action', true) },
          { label: 'Theme', handler: () => rollSingle(PLOT_TABLES.theme, 'Theme', true) },
        ],
      },
      names: {
        hint: 'Pick a lineage to name a character.',
        buildTiles: () => [
          { label: 'Ironlander', handler: rollIronlander },
          { label: 'Elf', handler: () => rollSingle(NAME_TABLES.elf_names, 'Elf') },
          { label: 'Giant', handler: () => rollSingle(NAME_TABLES.giant_names, 'Giant') },
          { label: 'Varou', handler: () => rollSingle(NAME_TABLES.varou_names, 'Varou') },
          { label: 'Troll', handler: () => rollSingle(NAME_TABLES.troll_names, 'Troll') },
        ],
      },
      settlement: {
        hint: 'Roll to sketch a region, place, or settlement.',
        buildTiles: () => [
          { label: 'Region', handler: () => rollSingle(SETTLEMENT_TABLES.region, 'Region') },
          { label: 'Location', handler: () => rollSingle(SETTLEMENT_TABLES.location, 'Location') },
          { label: 'Descriptor', handler: () => rollSingle(SETTLEMENT_TABLES.location_descriptor, 'Descriptor') },
          { label: 'Trouble', handler: () => rollSingle(SETTLEMENT_TABLES.settlement_trouble, 'Trouble') },
          { label: 'Settlement Name', handler: rollSettlementName },
        ],
      },
    };

    function renderOracle(key) {
      grid.innerHTML = '';
      initOracleGrid(grid, ORACLES[key].buildTiles());
      if (first) {
        log.innerHTML = '<div class="empty">' + ORACLES[key].hint + '</div>';
      }
    }

    select.addEventListener('change', () => renderOracle(select.value));
    renderOracle(select.value);
  </script>
