<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starforged Starship Oracles</title>
<script src="../shared/bubble.js"></script>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  #grid { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); }
  .oracle-picker {
    position: relative;
    flex: 0 0 auto;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  .oracle-trigger {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 10px 16px;
    font-family: "Figtree", sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--text);
    cursor: pointer;
  }
  .oracle-trigger:focus {
    outline: none;
    border-color: var(--gem-d12);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--gem-d12) 25%, transparent);
  }
  .oracle-chevron { width: 16px; height: 16px; color: var(--muted); flex: 0 0 auto; transition: transform 160ms ease; }
  .oracle-trigger[aria-expanded="true"] .oracle-chevron { transform: rotate(180deg); }
  .oracle-menu {
    position: absolute;
    left: 12px;
    right: 12px;
    top: 100%;
    margin-top: 6px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 6px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    z-index: 5;
    max-height: 60vh;
    overflow-y: auto;
  }
  .oracle-menu[hidden] { display: none; }
  .oracle-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: 10px;
    padding: 10px 12px;
    font-family: "Figtree", sans-serif;
    font-weight: 600;
    font-size: 0.88rem;
    color: var(--text);
    cursor: pointer;
  }
  .oracle-menu-item[aria-selected="true"] { color: var(--gem-d12); }
  .oracle-menu-item:hover, .oracle-menu-item:focus {
    outline: none;
    background: color-mix(in srgb, var(--gem-d12) 14%, var(--card));
  }
</style>
</head>
<body>
  <noscript>
    <div style="padding:16px;font-family:system-ui,sans-serif;">
      <h2>Starforged Starship Oracles</h2>
      <p>This tool needs JavaScript, which is currently disabled in this WebView.</p>
      <p>That shouldn't happen - the app enables it itself. Please report this bug.</p>
    </div>
  </noscript>

  <div class="oracle-picker">
    <button id="oracleTrigger" class="oracle-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
      <span id="oracleTriggerLabel">Starship</span>
      <svg class="oracle-chevron" viewBox="0 0 24 24" fill="none"><polyline points="6 9 12 15 18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div id="oracleMenu" class="oracle-menu" role="listbox" aria-label="Oracle" hidden>
      <button type="button" class="oracle-menu-item" data-key="starship" role="option" aria-selected="true">Starship</button>
      <button type="button" class="oracle-menu-item" data-key="mission" role="option" aria-selected="false">Mission</button>
    </div>
  </div>
  <div id="log"></div>
  <div id="grid"></div>

  <script src="../shared/oracle.js"></script>
  <script>

const STARSHIP_TABLES = {"type":{"name":"Starship Type","dice":"1d100","rows":[{"min":1,"max":2,"text":"Carrier","text2":"Launches fighters"},{"min":3,"max":6,"text":"Corvette","text2":"Light attack ship"},{"min":7,"max":11,"text":"Courier","text2":"Fast transport"},{"min":12,"max":14,"text":"Cruiser","text2":"Medium attack ship"},{"min":15,"max":16,"text":"Dreadnought","text2":"Heavy attack ship"},{"min":17,"max":19,"text":"Escape pod","text2":"Survival craft"},{"min":20,"max":22,"text":"Foundry","text2":"Mobile construction platform"},{"min":23,"max":27,"text":"Harvester","text2":"Fuel or energy excavator"},{"min":28,"max":33,"text":"Hauler","text2":"Heavy transport"},{"min":34,"max":36,"text":"Hunter","text2":"Stealthy attack ship"},{"min":37,"max":38,"text":"Ironhome","text2":"Habitat"},{"min":39,"max":42,"text":"Mender","text2":"Utility or repair"},{"min":43,"max":47,"text":"Outbounder","text2":"Remote survey or research"},{"min":48,"max":50,"text":"Pennant","text2":"Command ship"},{"min":51,"max":56,"text":"Prospector","text2":"Mineral excavator"},{"min":57,"max":61,"text":"Reclaimer","text2":"Salvage or rescue"},{"min":62,"max":64,"text":"Shuttle","text2":"Short-range transport"},{"min":65,"max":67,"text":"Snub fighter","text2":"Small attack craft"},{"min":68,"max":82,"text":"Multipurpose","text2":"Starship Mission"},{"min":83,"max":84,"text":"Unusual or unknown"},{"min":85,"max":94,"text":"Fleet"},{"min":95,"max":100,"text":"Ships in conflict (roll twice)"}]},"fleet":{"name":"Fleet","dice":"1d100","rows":[{"min":1,"max":10,"text":"Battle fleet"},{"min":11,"max":25,"text":"Pirate wing"},{"min":26,"max":35,"text":"Raider horde"},{"min":36,"max":50,"text":"Salvager hive"},{"min":51,"max":60,"text":"Settler caravan"},{"min":61,"max":70,"text":"Trade caravan"},{"min":71,"max":90,"text":"Transport and escorts"},{"min":91,"max":100,"text":"Starship Mission"}]},"initial_contact":{"name":"Initial Contact","dice":"1d100","rows":[{"min":1,"max":3,"text":"Familiar"},{"m const MISSION_TABLES = {"terminus":{"name":"Terminus","dice":"1d100","rows":[{"min":1,"max":3,"text":"Blockade a location"},{"min":4,"max":6,"text":"Break a blockade"},{"min":7,"max":9,"text":"Collect a resource"},{"min":10,"max":11,"text":"Command others"},{"min":12,"max":14,"text":"Conduct diplomacy"},{"min":15,"max":17,"text":"Conduct espionage"},{"min":18,"max":20,"text":"Conduct piracy"},{"min":21,"max":23,"text":"Conduct research"},{"min":24,"max":26,"text":"Defend against an attack"},{"min":27,"max":29,"text":"Deliver messages or data"},{"min":30,"max":32,"text":"Establish a settlement"},{"min":33,"max":35,"text":"Evacuate a location"},{"min":36,"max":37,"text":"Explore a region"},{"min":38,"max":39,"text":"Hold prisoners"},{"min":40,"max":42,"text":"Hunt down another ship"},{"min":43,"max":45,"text":"Launch an attack"},{"min":46,"max":48,"text":"Patrol an area"},{"min":49,"max":51,"text":"Provide medical aid"},{"min":52,"max":54,"text":"Provide repairs"},{"min":55,"max":57,"text":"Provide shelter"},{"min":58,"max":59,"text":"Quarantine a danger"},{"min":60,"max":62,"text":"Raid a settlement"},{"min":63,"max":65,"text":"Resupply a settlement"},{"min":66,"max":68,"text":"Retrieve salvage"},{"min":69,"max":71,"text":"Search and rescue"},{"min":72,"max":74,"text":"Smuggle cargo"},{"min":75,"max":77,"text":"Survey a site"},{"min":78,"max":79,"text":"Test a technology"},{"min":80,"max":82,"text":"Transport cargo"},{"min":83,"max":85,"text":"Transport passengers"},{"min":86,"max":90,"text":"Action + Theme"},{"min":91,"max":100,"text":"Roll twice"}]},"outlands":{"name":"Outlands","dice":"1d100","rows":[{"min":1,"max":2,"text":"Blockade a location"},{"min":3,"max":4,"text":"Break a blockade"},{"min":5,"max":7,"text":"Collect a resource"},{"min":8,"max":9,"text":"Command others"},{"min":10,"max":11,"text":"Conduct diplomacy"},{"min":12,"max":13,"text":"Conduct espionage"},{"min":14,"max":16,"text":"Conduct piracy"},{"min":17,"max":20,"text":"Conduct research"},{"min":     const log = document.getElementById('log');
    const grid = document.getElementById('grid');
    let first = true;

    function logCard(spec) {
      if (first) { log.innerHTML = ''; first = false; }
      appendCard(log, spec);
    }

    function rollSingle(table, label, withRoll) {
      const { roll, text } = rollTable(table);
      logCard({ total: text, detailText: withRoll ? 'rolled ' + roll : null });
      reportToNative(label + ': ' + text, text.slice(0, 4));
    }

    // For a table_text2 table (a result plus a summary column) - shows the
    // summary as the detail line instead of the roll number.
    function rollSingle2(table, label) {
      const { text, row } = rollTable(table);
      logCard({ total: text, detailText: row.text2 || null });
      reportToNative(label + ': ' + text, text.slice(0, 4));
    }


    const ORACLES = {
      starship: {
        label: "Starship",
        hint: "Roll to describe an encountered starship.",
        buildTiles: () => [
          { label: "Starship Type", handler: () => rollSingle2(STARSHIP_TABLES.type, "Starship Type") },
          { label: "Fleet", handler: () => rollSingle(STARSHIP_TABLES.fleet, "Fleet", true) },
          { label: "Initial Contact", handler: () => rollSingle(STARSHIP_TABLES.initial_contact, "Initial Contact", true) },
          { label: "First Look", handler: () => rollSingle(STARSHIP_TABLES.first_look, "First Look", true) },
          { label: "Starship Name", handler: () => rollSingle(STARSHIP_TABLES.starship_name, "Starship Name", true) }
        ],
      },
      mission: {
        label: "Mission",
        hint: "Roll a starship's mission by how far from known space you are.",
        buildTiles: () => [
          { label: "Terminus", handler: () => rollSingle(MISSION_TABLES.terminus, "Terminus", true) },
          { label: "Outlands", handler: () => rollSingle(MISSION_TABLES.outlands, "Outlands", true) },
          { label: "Expanse", handler: () => rollSingle(MISSION_TABLES.expanse, "Expanse", true) }
        ],
      },
    };

    function renderOracle(key) {
      grid.innerHTML = '';
      initOracleGrid(grid, ORACLES[key].buildTiles());
      if (first) {
        log.innerHTML = '<div class="empty">' + ORACLES[key].hint + '</div>';
      }
    }

    const oracleTrigger = document.getElementById('oracleTrigger');
    const oracleTriggerLabel = document.getElementById('oracleTriggerLabel');
    const oracleMenu = document.getElementById('oracleMenu');

    function openOracleMenu() {
      oracleMenu.hidden = false;
      oracleTrigger.setAttribute('aria-expanded', 'true');
      document.addEventListener('click', handleOracleMenuOutsideClick, { capture: true });
    }
    function closeOracleMenu() {
      oracleMenu.hidden = true;
      oracleTrigger.setAttribute('aria-expanded', 'false');
      document.removeEventListener('click', handleOracleMenuOutsideClick, { capture: true });
    }
    function handleOracleMenuOutsideClick(e) {
      if (!oracleMenu.contains(e.target) && e.target !== oracleTrigger) closeOracleMenu();
    }
    oracleTrigger.addEventListener('click', () => {
      if (oracleMenu.hidden) openOracleMenu(); else closeOracleMenu();
    });

    function selectOracle(key) {
      oracleTriggerLabel.textContent = ORACLES[key].label;
      oracleMenu.querySelectorAll('.oracle-menu-item').forEach((item) => {
        item.setAttribute('aria-selected', item.dataset.key === key ? 'true' : 'false');
      });
      renderOracle(key);
    }
    oracleMenu.querySelectorAll('.oracle-menu-item').forEach((item) => {
      item.addEventListener('click', () => {
        selectOracle(item.dataset.key);
        closeOracleMenu();
      });
    });

    selectOracle('starship');

  </script>
</body>
</html>
