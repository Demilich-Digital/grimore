<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starforged Space Oracles</title>
<script src="../shared/bubble.js"></script>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  #grid { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); }
  .oracle-picker {
    position: relative;
    flex: 0 0 auto;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  .oracle-trigger {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 10px 16px;
    font-family: "Figtree", sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--text);
    cursor: pointer;
  }
  .oracle-trigger:focus {
    outline: none;
    border-color: var(--gem-d12);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--gem-d12) 25%, transparent);
  }
  .oracle-chevron { width: 16px; height: 16px; color: var(--muted); flex: 0 0 auto; transition: transform 160ms ease; }
  .oracle-trigger[aria-expanded="true"] .oracle-chevron { transform: rotate(180deg); }
  .oracle-menu {
    position: absolute;
    left: 12px;
    right: 12px;
    top: 100%;
    margin-top: 6px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 6px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    z-index: 5;
    max-height: 60vh;
    overflow-y: auto;
  }
  .oracle-menu[hidden] { display: none; }
  .oracle-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: 10px;
    padding: 10px 12px;
    font-family: "Figtree", sans-serif;
    font-weight: 600;
    font-size: 0.88rem;
    color: var(--text);
    cursor: pointer;
  }
  .oracle-menu-item[aria-selected="true"] { color: var(--gem-d12); }
  .oracle-menu-item:hover, .oracle-menu-item:focus {
    outline: none;
    background: color-mix(in srgb, var(--gem-d12) 14%, var(--card));
  }
</style>
</head>
<body>
  <noscript>
    <div style="padding:16px;font-family:system-ui,sans-serif;">
      <h2>Starforged Space Oracles</h2>
      <p>This tool needs JavaScript, which is currently disabled in this WebView.</p>
      <p>That shouldn't happen - the app enables it itself. Please report this bug.</p>
    </div>
  </noscript>

  <div class="oracle-picker">
    <button id="oracleTrigger" class="oracle-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
      <span id="oracleTriggerLabel">Space Encounter</span>
      <svg class="oracle-chevron" viewBox="0 0 24 24" fill="none"><polyline points="6 9 12 15 18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div id="oracleMenu" class="oracle-menu" role="listbox" aria-label="Oracle" hidden>
      <button type="button" class="oracle-menu-item" data-key="encounter" role="option" aria-selected="true">Space Encounter</button>
      <button type="button" class="oracle-menu-item" data-key="sighting" role="option" aria-selected="false">Space Sighting</button>
      <button type="button" class="oracle-menu-item" data-key="sector_name" role="option" aria-selected="false">Sector Name</button>
    </div>
  </div>
  <div id="log"></div>
  <div id="grid"></div>

  <script src="../shared/oracle.js"></script>
  <script>
    // Ironsworn: Starforged oracles, by Shawn Tomkin - CC BY 4.0

    // (https://github.com/rsek/datasworn). Rows are {min, max, text}; roll
    // the table's die and find the row whose range contains it.

const ENCOUNTER_TABLES = {"stellar_object":{"name":"Stellar Object","dice":"1d100","rows":[{"min":1,"max":15,"text":"Smoldering red star"},{"min":16,"max":30,"text":"Glowing orange star"},{"min":31,"max":45,"text":"Burning yellow star"},{"min":46,"max":50,"text":"Blazing blue star"},{"min":51,"max":60,"text":"Young star incubating in a molecular cloud"},{"min":61,"max":70,"text":"White dwarf shining with spectral light"},{"min":71,"max":75,"text":"Corrupted star radiating with unnatural light"},{"min":76,"max":80,"text":"Neutron star surrounded by intense magnetic fields"},{"min":81,"max":85,"text":"Two stars in close orbit connected by fiery tendrils of energy"},{"min":86,"max":90,"text":"Black hole allows nothing to escape\u2014not even light"},{"min":91,"max":98,"text":"Hypergiant star generating turbulent solar winds"},{"min":99,"max":99,"text":"Artificial star constructed by a long-dead civilization"},{"min":100,"max":100,"text":"Unstable star showing signs of impending supernova"}]},"peril":{"name":"Spaceborne Peril","dice":"1d100","rows":[{"min":1,"max":3,"text":"Artificial gravity generator malfunctions"},{"min":4,"max":6,"text":"Automated defenses or mines protect this area"},{"min":7,"max":9,"text":"Compartment catches fire or is breached"},{"min":10,"max":12,"text":"Contagion or illness threatens to take hold"},{"min":13,"max":15,"text":"Dust clouds imperil navigation or conceal foes"},{"min":16,"max":18,"text":"Energy storm looms"},{"min":19,"max":21,"text":"Familiar foe appears or sends an ominous message"},{"min":22,"max":24,"text":"Gravity well or vortex takes hold"},{"min":25,"max":27,"text":"Imperiled ship calls for help"},{"min":28,"max":30,"text":"Important device fails or malfunctions"},{"min":31,"max":33,"text":"Infestation is revealed"},{"min":34,"max":36,"text":"Intruder or stowaway creates trouble"},{"min":37,"max":39,"text":"Isolation or fear presses in"},{"min":40,"max":42,"text":"Life support system malfunctions"},{"min":43,"max":45,"text":"Meteoroid storm fills the sky"},{"min":46,"max":48,"text":"Mysterious wreckage portends a new threat"},{"min":49,"max":51,"text":"Nearby settlement calls for help"},{"min":52,"max":54,"text":"Old repair or patch fails"},{"min":55,"max":57,"text":"Onboard dispute or inner turmoil causes a disruption"},{"min":58,"max":60,"text":"Others obstruct your path or form a blockade"},{"min":61,"max":63,"text":"Phantom signals suggest a lurking foe"},{"min":64,"max":66,"text":"Pirates hunt for prey"},{"min":67,"max":69,"text":"Power fails"},{"min":70,"max":72,"text":"Primary drive or generator malfunctions"},{"min":73,"max":75,"text":"Sabotage is revealed"},{"min":76,"max":78,"text":"Shockwave or gravity wave approaches"},{"min":79,"max":81,"text":"Someone questions your presence here"},{"min":82,"max":84,"text":"Stellar anomaly emits hazardous energies"},{"min":85,"max":87,"text":"Threatening lifeform draws near"},{"min":88,"max":90,"text":"Troubling visions or apparitions"},{"min":91,"max":93,"text":"True nature of a cargo, occupant, or passenger is revealed"},{"min":94,"max":96,"text":"Unsettling sounds or disturbances"},{"min":97,"max":99,"text":"Action + Theme"},{"min":100,"max":100,"text":"Roll twice"}]},"opportunity":{"name":"Spaceborne Opportunity","dice":"1d100","rows":[{"min":1,"max":4,"text":"Advance warning of an environmental threat"},{"min":5,"max":8,"text":"Automated signal offers a helpful message or warning"},{"min":9,"max":12,"text":"Cache of cargo or supplies"},{"min":13,"max":16,"text":"Chance for fellowship or a moment of inner peace"},{"min":17,"max":20,"text":"Clear path through otherwise perilous space"},{"min":21,"max":24,"text":"Clue offers insight into a current quest or mystery"},{"min":25,"max":28,"text":"Clue to a lifeform's nature or vulnerabilities"},{"min":29,"max":32,"text":"Derelict ripe for the picking"},{"min":33,"max":36,"text":"Foe inadvertently reveals themselves or tips their hand"},{"min":37,"max":40,"text":"Friendly interaction with a benign lifeform"},{"min":41,"max":44,"text":"Friendly settlement in range"},{"min":45,"max":48,"text":"Friendly spacers at work here"},{"min":49,"max":52,"text":"Friendly starship crosses your path"},{"min":53,"max":56,"text":"Helpful or encouraging message from an acquaintance"},{"min":57,"max":60,"text":"Impressive vista offers comfort or inspiration"},{"min":61,"max":64,"text":"Interesting site offers opportunities for exploration"},{"min":65,"max":68,"text":"Mineral or energy resource detected"},{"min":69,"max":72,"text":"Navigational or environmental hazard is left behind"},{"min":73,"max":76,"text":"Opening to escape or avoid foes"},{"min":77,"max":80,"text":"Plea for help from a potential benefactor"},{"min":81,"max":84,"text":"Probe or beacon with useful data"},{"min":85,"max":88,"text":"Refuge offers a place to hide, plan, or recover"},{"min":89,"max":92,"text":"Sensors pinpoint a lurking foe"},{"min":93,"max":96,"text":"Sensors reveal helpful or interesting environmental data"},{"min":97,"max":100,"text":"Vehicle or equipment performs beyond expectations"}]}};
const SIGHTING_TABLES = {"terminus":{"name":"Terminus","dice":"1d100","rows":[{"min":1,"max":15,"text":"Stellar Object"},{"min":16,"max":35,"text":"Planet"},{"min":36,"max":40,"text":"Settlement"},{"min":41,"max":47,"text":"Starship"},{"min":48,"max":51,"text":"Derelict"},{"min":52,"max":53,"text":"Precursor Vault"},{"min":54,"max":55,"text":"Creature"},{"min":56,"max":60,"text":"Descriptor + Focus"},{"min":61,"max":65,"text":"Debris field: Mineral asteroids"},{"min":66,"max":68,"text":"Debris field: Frozen asteroids"},{"min":69,"max":70,"text":"Debris field: Crystalline asteroids"},{"min":71,"max":72,"text":"Debris field: Creature boneyard"},{"min":73,"max":74,"text":"Debris field: Metallic wreckage"},{"min":75,"max":76,"text":"Large rogue asteroid"},{"min":77,"max":78,"text":"Comet with a tail of ionized gas"},{"min":79,"max":81,"text":"Fiery energy storm"},{"min":82,"max":83,"text":"Chaotic meteoroid storm"},{"min":84,"max":85,"text":"Turbulent gravitational wave"},{"min":86,"max":93,"text":"Dense nebula cloud"},{"min":94,"max":98,"text":"Roll twice"},{"min":99,"max":100,"text":"Roll three times"}]},"outlands":{"name":"Outlands","dice":"1d100","rows":[{"min":1,"max":15,"text":"Stellar Object"},{"min":16,"max":35,"text":"Planet"},{"min":36,"max":38,"text":"Settlement"},{"min":39,"max":43,"text":"Starship"},{"min":44,"max":46,"text":"Derelict"},{"min":47,"max":49,"text":"Precursor Vault"},{"min":50,"max":52,"text":"Creature"},{"min":53,"max":58,"text":"Descriptor + Focus"},{"min":59,"max":63,"text":"Debris field: Mineral asteroids"},{"min":64,"max":66,"text":"Debris field: Frozen asteroids"},{"min":67,"max":68,"text":"Debris field: Crystalline asteroids"},{"min":69,"max":70,"text":"Debris field: Creature boneyard"},{"min":71,"max":72,"text":"Debris field: Metallic wreckage"},{"min":73,"max":74,"text":"Large rogue asteroid"},{"min":75,"max":76,"text":"Comet with a tail of ionized gas"},{"min":77,"max":80,"text":"Fiery energy storm"},{"min":81,"max":82,"text":"Chaotic meteoroid storm"},{"min":83,"max":85,"text":"Turbulent gravitational wave"},{"min":86,"max":93,"text":"Dense nebula cloud"},{"min":94,"max":98,"text":"Roll twice"},{"min":99,"max":100,"text":"Roll three times"}]},"expanse":{"name":"Expanse","dice":"1d100","rows":[{"min":1,"max":15,"text":"Stellar Object"},{"min":16,"max":35,"text":"Planet"},{"min":36,"max":37,"text":"Settlement"},{"min":38,"max":39,"text":"Starship"},{"min":40,"max":41,"text":"Derelict"},{"min":42,"max":45,"text":"Precursor Vault"},{"min":46,"max":49,"text":"Creature"},{"min":50,"max":56,"text":"Descriptor + Focus"},{"min":57,"max":61,"text":"Debris field: Mineral asteroids"},{"min":62,"max":64,"text":"Debris field: Frozen asteroids"},{"min":65,"max":66,"text":"Debris field: Crystalline asteroids"},{"min":67,"max":68,"text":"Debris field: Creature boneyard"},{"min":69,"max":70,"text":"Debris field: Metallic wreckage"},{"min":71,"max":72,"text":"Large rogue asteroid"},{"min":73,"max":74,"text":"Comet with a tail of ionized gas"},{"min":75,"max":79,"text":"Fiery energy storm"},{"min":80,"max":81,"text":"Chaotic meteoroid storm"},{"min":82,"max":85,"text":"Turbulent gravitational wave"},{"min":86,"max":93,"text":"Dense nebula cloud"},{"min":94,"max":98,"text":"Roll twice"},{"min":99,"max":100,"text":"Roll three times"}]}};
const SECTOR_NAME_TABLES = {"prefix":{"name":"Prefix","dice":"1d100","rows":[{"min":1,"max":2,"text":"Accursed"},{"min":3,"max":4,"text":"Ashen"},{"min":5,"max":6,"text":"Asteria"},{"min":7,"max":8,"text":"Bitter"},{"min":9,"max":10,"text":"Blighted"},{"min":11,"max":12,"text":"Bloodied"},{"min":13,"max":14,"text":"Boundless"},{"min":15,"max":16,"text":"Burning"},{"min":17,"max":18,"text":"Cortana"},{"min":19,"max":20,"text":"Corvus"},{"min":21,"max":22,"text":"Crimson"},{"min":23,"max":24,"text":"Cygnus"},{"min":25,"max":26,"text":"Delphi"},{"min":27,"max":28,"text":"Delphian"},{"min":29,"max":30,"text":"Devil's"},{"min":31,"max":32,"text":"Ebon"},{"min":33,"max":34,"text":"Essus"},{"min":35,"max":36,"text":"Fallen"},{"min":37,"max":38,"text":"Ferrous"},{"min":39,"max":40,"text":"Fool's"},{"min":41,"max":42,"text":"Forgotten"},{"min":43,"max":44,"text":"Haunted"},{"min":45,"max":46,"text":"Hidden"},{"min":47,"max":48,"text":"Hollow"},{"min":49,"max":50,"text":"Igneous"},{"min":51,"max":52,"text":"Infernal"},{"min":53,"max":54,"text":"Invidia"},{"min":55,"max":56,"text":"Iron"},{"min":57,"max":58,"text":"Kalidas"},{"min":59,"max":60,"text":"Kronos"},{"min":61,"max":62,"text":"Lacuna"},{"min":63,"max":64,"text":"Lumen"},{"min":65,"max":66,"text":"Mobius"},{"min":67,"max":68,"text":"Morien"},{"min":69,"max":70,"text":"Onyx"},{"min":71,"max":72,"text":"Outer"},{"min":73,"max":74,"text":"Sanguis"},{"min":75,"max":76,"text":"Scarred"},{"min":77,"max":78,"text":"Scorched"},{"min":79,"max":80,"text":"Shattered"},{"min":81,"max":82,"text":"Shrouded"},{"min":83,"max":84,"text":"Sindri"},{"min":85,"max":86,"text":"Solana"},{"min":87,"max":88,"text":"Stygian"},{"min":89,"max":90,"text":"Sulaco"},{"min":91,"max":92,"text":"Sundered"},{"min":93,"max":94,"text":"Thunor"},{"min":95,"max":96,"text":"Vanguard"},{"min":97,"max":98,"text":"Veiled"},{"min":99,"max":100,"text":"Wasted"}]},"suffix":{"name":"Suffix","dice":"1d100","rows":[{"min":1,"max":2,"text":"Abyss"},{"min":3,"max":4,"text":"Anvil"},{"min":5,"max":6,"text":"Arch"},{"min":7,"max":8,"text":"Breach"},{"min":9,"max":10,"text":"Chain"},{"min":11,"max":12,"text":"Channel"},{"min":13,"max":14,"text":"Chasm"},{"min":15,"max":16,"text":"Circlet"},{"min":17,"max":18,"text":"Cluster"},{"min":19,"max":20,"text":"Crossing"},{"min":21,"max":22,"text":"Crown"},{"min":23,"max":24,"text":"Currents"},{"min":25,"max":26,"text":"Deep"},{"min":27,"max":28,"text":"Desolation"},{"min":29,"max":30,"text":"Drift"},{"min":31,"max":32,"text":"Flow"},{"min":33,"max":34,"text":"Flux"},{"min":35,"max":36,"text":"Gap"},{"min":37,"max":38,"text":"Gate"},{"min":39,"max":40,"text":"Gyre"},{"min":41,"max":42,"text":"Heart"},{"min":43,"max":44,"text":"Helix"},{"min":45,"max":46,"text":"Juncture"},{"min":47,"max":48,"text":"Limits"},{"min":49,"max":50,"text":"Locus"},{"min":51,"max":52,"text":"Maelstrom"},{"min":53,"max":54,"text":"Margin"},{"min":55,"max":56,"text":"Maw"},{"min":57,"max":58,"text":"Maze"},{"min":59,"max":60,"text":"Nexus"},{"min":61,"max":62,"text":"Oasis"},{"min":63,"max":64,"text":"Pass"},{"min":65,"max":66,"text":"Pit"},{"min":67,"max":68,"text":"Pyre"},{"min":69,"max":70,"text":"Reach"},{"min":71,"max":72,"text":"Rest"},{"min":73,"max":74,"text":"Rift"},{"min":75,"max":76,"text":"Sanctum"},{"min":77,"max":78,"text":"Shallows"},{"min":79,"max":80,"text":"Shoal"},{"min":81,"max":82,"text":"Spine"},{"min":83,"max":84,"text":"Straits"},{"min":85,"max":86,"text":"Threshold"},{"min":87,"max":88,"text":"Tide"},{"min":89,"max":90,"text":"Verge"},{"min":91,"max":92,"text":"Vertex"},{"min":93,"max":94,"text":"Vigil"},{"min":95,"max":96,"text":"Void"},{"min":97,"max":98,"text":"Web"},{"min":99,"max":100,"text":"Zenith"}]}};

    const log = document.getElementById('log');
    const grid = document.getElementById('grid');
    let first = true;

    function logCard(spec) {
      if (first) { log.innerHTML = ''; first = false; }
      appendCard(log, spec);
    }

    function rollSingle(table, label, withRoll) {
      const { roll, text } = rollTable(table);
      logCard({ total: text, detailText: withRoll ? 'rolled ' + roll : null });
      reportToNative(label + ': ' + text, text.slice(0, 4));
    }

    // For a table_text2 table (a result plus a summary column) - shows the
    // summary as the detail line instead of the roll number.
    function rollSingle2(table, label) {
      const { text, row } = rollTable(table);
      logCard({ total: text, detailText: row.text2 || null });
      reportToNative(label + ': ' + text, text.slice(0, 4));
    }

    // Sector Name: Prefix + Suffix are both standalone capitalized words
    // (unlike classic Ironsworn's Settlement Name, these don't lowercase the
    // second half) - "Accursed" + "Abyss" -> "Accursed Abyss".
    function rollSectorName() {
      const prefix = rollTable(SECTOR_NAME_TABLES.prefix);
      const suffix = rollTable(SECTOR_NAME_TABLES.suffix);
      const name = prefix.text + ' ' + suffix.text;
      logCard({ total: name });
      reportToNative('Sector Name: ' + name, name.slice(0, 4));
    }


    const ORACLES = {
      encounter: {
        label: "Space Encounter",
        hint: "Roll for a space encounter.",
        buildTiles: () => [
          { label: "Stellar Object", handler: () => rollSingle(ENCOUNTER_TABLES.stellar_object, "Stellar Object", true) },
          { label: "Spaceborne Peril", handler: () => rollSingle(ENCOUNTER_TABLES.peril, "Spaceborne Peril", true) },
          { label: "Spaceborne Opportunity", handler: () => rollSingle(ENCOUNTER_TABLES.opportunity, "Spaceborne Opportunity", true) }
        ],
      },
      sighting: {
        label: "Space Sighting",
        hint: "Roll a space sighting by how far from known space you are.",
        buildTiles: () => [
          { label: "Terminus", handler: () => rollSingle(SIGHTING_TABLES.terminus, "Terminus", true) },
          { label: "Outlands", handler: () => rollSingle(SIGHTING_TABLES.outlands, "Outlands", true) },
          { label: "Expanse", handler: () => rollSingle(SIGHTING_TABLES.expanse, "Expanse", true) }
        ],
      },
      sector_name: {
        label: "Sector Name",
        hint: "Roll a sector name, or its parts individually.",
        buildTiles: () => [
          { label: "Sector Name", handler: rollSectorName },
          { label: "Prefix", handler: () => rollSingle(SECTOR_NAME_TABLES.prefix, "Prefix", true) },
          { label: "Suffix", handler: () => rollSingle(SECTOR_NAME_TABLES.suffix, "Suffix", true) }
        ],
      },
    };

    function renderOracle(key) {
      grid.innerHTML = '';
      initOracleGrid(grid, ORACLES[key].buildTiles());
      if (first) {
        log.innerHTML = '<div class="empty">' + ORACLES[key].hint + '</div>';
      }
    }

    const oracleTrigger = document.getElementById('oracleTrigger');
    const oracleTriggerLabel = document.getElementById('oracleTriggerLabel');
    const oracleMenu = document.getElementById('oracleMenu');

    function openOracleMenu() {
      oracleMenu.hidden = false;
      oracleTrigger.setAttribute('aria-expanded', 'true');
      document.addEventListener('click', handleOracleMenuOutsideClick, { capture: true });
    }
    function closeOracleMenu() {
      oracleMenu.hidden = true;
      oracleTrigger.setAttribute('aria-expanded', 'false');
      document.removeEventListener('click', handleOracleMenuOutsideClick, { capture: true });
    }
    function handleOracleMenuOutsideClick(e) {
      if (!oracleMenu.contains(e.target) && e.target !== oracleTrigger) closeOracleMenu();
    }
    oracleTrigger.addEventListener('click', () => {
      if (oracleMenu.hidden) openOracleMenu(); else closeOracleMenu();
    });

    function selectOracle(key) {
      oracleTriggerLabel.textContent = ORACLES[key].label;
      oracleMenu.querySelectorAll('.oracle-menu-item').forEach((item) => {
        item.setAttribute('aria-selected', item.dataset.key === key ? 'true' : 'false');
      });
      renderOracle(key);
    }
    oracleMenu.querySelectorAll('.oracle-menu-item').forEach((item) => {
      item.addEventListener('click', () => {
        selectOracle(item.dataset.key);
        closeOracleMenu();
      });
    });

    selectOracle('encounter');

  </script>
</body>
</html>
