<link rel="stylesheet" href="../shared/theme.css">
<style>
  #grid { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); }
  /* Two-tap navigation instead of the dropdown picker used by the other
     Starforged tools - 11 planet types x ~8 tables each is too much for one
     dropdown (see the diary/plan note on this tool). Tapping a type tile on
     the landing grid swaps in that type's own table grid; this back bar
     (hidden on the landing grid) is the only way back up a level. */
  .planet-back-bar {
    flex: 0 0 auto;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  .planet-back-bar[hidden] { display: none; }
  .planet-back-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 10px 16px;
    font-family: "Figtree", sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--text);
    cursor: pointer;
  }
  .planet-back-icon { width: 16px; height: 16px; color: var(--muted); flex: 0 0 auto; }
</style>
</head>

    const log = document.getElementById('log');
    const grid = document.getElementById('grid');
    let first = true;

    function logCard(spec) {
      if (first) { log.innerHTML = ''; first = false; }
      appendCard(log, spec);
    }

    function rollSingle(table, label, withRoll) {
      const { roll, text } = rollTable(table);
      logCard({ total: text, detailText: withRoll ? 'rolled ' + roll : null });
      reportToNative(label + ': ' + text, text.slice(0, 4));
    }

    // ---- navigation: landing grid (planet types) <-> a type's table grid,
    // or the small Peril/Opportunity (Lifebearing/Lifeless) sub-grids ----

    const backBar = document.getElementById('backBar');
    const backBtn = document.getElementById('backBtn');
    const backLabel = document.getElementById('backLabel');

    // A landing-grid tile that opens a sub-grid instead of rolling gets a
    // trailing "›" so it reads as "opens something" next to the one
    // tile that actually rolls (Planetary Class) - simpler than a second
    // tile layout variant, and reads fine in the existing centered tile style.
    function navTile(label, handler) {
      return { label: label + ' ›', handler };
    }

    function renderLanding() {
      backBar.hidden = true;
      grid.innerHTML = '';
      const tiles = [
        { label: 'Planetary Class', handler: () => rollSingle(CLASS_TABLE, 'Planetary Class', true) },
      ];
      Object.keys(PLANET_TYPES).forEach((key) => {
        tiles.push(navTile(PLANET_TYPES[key].label, () => renderType(key)));
      });
      tiles.push(navTile('Planetside Peril', () => renderPerilOpportunity('peril', 'Planetside Peril', PERIL_TABLES)));
      tiles.push(navTile('Planetside Opportunity', () => renderPerilOpportunity('opportunity', 'Planetside Opportunity', OPPORTUNITY_TABLES)));
      initOracleGrid(grid, tiles);
      if (first) {
        log.innerHTML = '<div class="empty">Roll Planetary Class, or tap a planet type to roll its tables.</div>';
      }
    }

    function renderType(key) {
      const type = PLANET_TYPES[key];
      backLabel.textContent = type.label;
      backBar.hidden = false;
      grid.innerHTML = '';
      const tiles = Object.keys(type.tables).map((tableKey) => {
        const table = type.tables[tableKey];
        return { label: table.name, handler: () => rollSingle(table, type.label + ' ' + table.name, true) };
      });
      initOracleGrid(grid, tiles);
    }

    function renderPerilOpportunity(key, label, tables) {
      backLabel.textContent = label;
      backBar.hidden = false;
      grid.innerHTML = '';
      const tiles = Object.keys(tables).map((tableKey) => {
        const table = tables[tableKey];
        return { label: table.name, handler: () => rollSingle(table, label + ' (' + table.name + ')', true) };
      });
      initOracleGrid(grid, tiles);
    }

    backBtn.addEventListener('click', renderLanding);

    renderLanding();
  </script>
