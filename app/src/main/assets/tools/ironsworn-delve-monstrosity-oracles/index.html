<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ironsworn Delve Monstrosity Oracles</title>
<script src="../shared/bubble.js"></script>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  #grid { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); }
</style>
</head>
<body>
  <noscript>
    <div style="padding:16px;font-family:system-ui,sans-serif;">
      <h2>Ironsworn Delve Monstrosity Oracles</h2>
      <p>This tool needs JavaScript, which is currently disabled in this WebView.</p>
      <p>That shouldn't happen - the app enables it itself. Please report this bug.</p>
    </div>
  </noscript>

  <div id="log"></div>
  <div id="grid"></div>

  <script src="../shared/oracle.js"></script>
  <script>
    // Ironsworn: Delve oracles, by Shawn Tomkin - CC BY 4.0
    // (https://creativecommons.org/licenses/by/4.0). Sourced from Datasworn
    // (https://github.com/rsek/datasworn). Rows are {min, max, text}; roll
    // 1d100 and find the row whose range contains it.

    const MONSTROSITY_TABLES = {"size":{"name":"Size","dice":"1d100","rows":[{"min":1,"max":5,"text":"Tiny (rodent-sized)"},{"min":6,"max":30,"text":"Small (hound-sized)"},{"min":31,"max":65,"text":"Medium (person-sized)"},{"min":66,"max":94,"text":"Large (giant-sized)"},{"min":95,"max":99,"text":"Huge (whale-sized)"},{"min":100,"max":100,"text":"Titanic (incomprehensible)"}]},"primary_form":{"name":"Primary Form","dice":"1d100","rows":[{"min":1,"max":15,"text":"Beast / mammal"},{"min":16,"max":25,"text":"Humanoid"},{"min":26,"max":31,"text":"Bird"},{"min":32,"max":37,"text":"Spider"},{"min":38,"max":43,"text":"Snake"},{"min":44,"max":49,"text":"Worm / slug"},{"min":50,"max":55,"text":"Lizard"},{"min":56,"max":61,"text":"Insect"},{"min":62,"max":66,"text":"Amorphous"},{"min":67,"max":69,"text":"Crustacean"},{"min":70,"max":71,"text":"Fish"},{"min":72,"max":73,"text":"Octopoid"},{"min":74,"max":75,"text":"Amphibian"},{"min":76,"max":77,"text":"Plant"},{"min":78,"max":78,"text":"Incorporeal"},{"min":79,"max":79,"text":"Mineral"},{"min":80,"max":80,"text":"Elemental"},{"min":81,"max":100,"text":"Hybrid (roll twice)"}]},"characteristics":{"name":"Characteristics","dice":"1d100","rows":[{"min":1,"max":5,"text":"Extra limbs"},{"min":6,"max":10,"text":"Fangs / rows of sharp teeth"},{"min":11,"max":15,"text":"Claws / talons"},{"min":16,"max":20,"text":"Strange color / markings"},{"min":21,"max":25,"text":"Horns / tusks"},{"min":26,"max":30,"text":"Oversized mouth"},{"min":31,"max":35,"text":"Spikes / spines"},{"min":36,"max":40,"text":"Tail"},{"min":41,"max":45,"text":"Multi-segmented body"},{"min":46,"max":50,"text":"Wings"},{"min":51,"max":54,"text":"Stinger / barbs"},{"min":55,"max":58,"text":"Many-eyed"},{"min":59,"max":62,"text":"Distinctive sound"},{"min":63,"max":66,"text":"Tentacles / tendrils"},{"min":67,"max":69,"text":"Mandibles / pincers"},{"min":70,"max":72,"text":"Luminescent"},{"min":73,"max":75,"text":"Antennae / sensory organs"},{"min":76,"max":78,"text":"Proboscis / inner jaw"},{"min":79,"max":81,"text":"Exoskeleton / shell"},{"min":82,"max":84,"text":"Bony protuberances"},{"min":85,"max":87,"text":"Corrupted flesh"},{"min":88,"max":90,"text":"Semi-transparent"},{"min":91,"max":93,"text":"Scarred / injured"},{"min":94,"max":95,"text":"Egg sac / carried offspring"},{"min":96,"max":97,"text":"Rotting / skeletal"},{"min":98,"max":98,"text":"Mummified / desiccated"},{"min":99,"max":99,"text":"Multi-headed"},{"min":100,"max":100,"text":"Etched with mystic runes"}]},"abilities":{"name":"Abilities","dice":"1d100","rows":[{"min":1,"max":4,"text":"Keen senses"},{"min":5,"max":8,"text":"Intimidating vocalization"},{"min":9,"max":12,"text":"Climber"},{"min":13,"max":16,"text":"Intelligent"},{"min":17,"max":20,"text":"Swift"},{"min":21,"max":24,"text":"Powerful bite"},{"min":25,"max":28,"text":"Stealthy / ambusher"},{"min":29,"max":32,"text":"Horrid visage"},{"min":33,"max":36,"text":"Strong"},{"min":37,"max":40,"text":"Camouflaged"},{"min":41,"max":43,"text":"Flier / glider"},{"min":44,"max":46,"text":"Poisonous"},{"min":47,"max":49,"text":"Semiaquatic / swimmer"},{"min":50,"max":52,"text":"Grappler / entangler"},{"min":53,"max":55,"text":"Leaper"},{"min":56,"max":58,"text":"Crusher / constrictor"},{"min":59,"max":61,"text":"Armored"},{"min":62,"max":64,"text":"Burrower"},{"min":65,"max":67,"text":"Noxious smell"},{"min":68,"max":69,"text":"Trap-setter"},{"min":70,"max":71,"text":"Parasitic"},{"min":72,"max":73,"text":"Vibration sense"},{"min":74,"max":75,"text":"Breath weapon / toxic spew"},{"min":76,"max":77,"text":"Mimicry"},{"min":78,"max":79,"text":"Shapeshifting"},{"min":80,"max":81,"text":"Control lesser creatures"},{"min":82,"max":83,"text":"Echolocation"},{"min":84,"max":85,"text":"Electric shock"},{"min":86,"max":87,"text":"Acidic"},{"min":88,"max":89,"text":"Symbiotic"},{"min":90,"max":91,"text":"Shoot projectiles"},{"min":92,"max":92,"text":"Paralyzing"},{"min":93,"max":93,"text":"Immune to iron"},{"min":94,"max":94,"text":"Feels no pain"},{"min":95,"max":95,"text":"Enact rituals"},{"min":96,"max":96,"text":"Create illusions"},{"min":97,"max":97,"text":"Mind control / telepathy"},{"min":98,"max":98,"text":"Move between realities"},{"min":99,"max":99,"text":"Wield weapons"},{"min":100,"max":100,"text":"Control elements"}]}};

    const log = document.getElementById('log');
    const grid = document.getElementById('grid');
    let first = true;

    function logCard(spec) {
      if (first) { log.innerHTML = ''; first = false; }
      appendCard(log, spec);
    }

    function rollSingle(table, label, withRoll) {
      const { roll, text } = rollTable(table);
      logCard({ total: text, detailText: withRoll ? 'rolled ' + roll : null });
      reportToNative(label + ': ' + text, text.slice(0, 4));
    }

    const ORACLE = {
      label: 'Monstrosity Oracles',
      hint: 'Roll to build a monstrosity, one trait at a time.',
      buildTiles: () => [
        { label: 'Size', handler: () => rollSingle(MONSTROSITY_TABLES.size, 'Size', true) },
        { label: 'Primary Form', handler: () => rollSingle(MONSTROSITY_TABLES.primary_form, 'Primary Form', true) },
        { label: 'Characteristics', handler: () => rollSingle(MONSTROSITY_TABLES.characteristics, 'Characteristics', true) },
        { label: 'Abilities', handler: () => rollSingle(MONSTROSITY_TABLES.abilities, 'Abilities', true) },
      ],
    };

    log.innerHTML = '<div class="empty">' + ORACLE.hint + '</div>';
    initOracleGrid(grid, ORACLE.buildTiles());
  </script>
</body>
</html>
